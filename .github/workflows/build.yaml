# Build ghcr.io/robmdunn/cert-update for the homelab's synology-cert-update
# CronWorkflow (robmdunn/homelab, apps/ops/jobs/manifests/synology-cert.yaml).
#
# Same tags as robmdunn/ci's build-image workflow, which this repo can't call
# (a public repo can't use a reusable workflow from a private one):
#   <yyyymmddHHMMSS>-<sha7>  immutable; what homelab pins
#   sha-<sha7>, latest       convenience only
# Pull requests build but never push.
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # The cluster is all arm64; native runner, no QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Compute tag
        id: tag
        run: |
          ts=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
          echo "tag=${ts}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/robmdunn/cert-update
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ steps.tag.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cert-update
          cache-to: type=gha,mode=max,scope=cert-update

      - name: Smoke test
        # The script parses its arguments before doing anything, so --help
        # proves the image's Python and dependencies import cleanly.
        if: steps.tag.outputs.push != 'true'
        run: |
          docker buildx build --load -t cert-update:test .
          docker run --rm cert-update:test python synology.py --help
